<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PAGELLE BOOK COVERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <picture class="login-bg-picture" aria-hidden="true">
    <source media="(min-width: 768px) and (orientation: landscape)" srcset="assets/login-bg-landscape.jpg" />
    <img src="assets/login-bg.jpg" alt="" />
  </picture>

  <header class="login-top-bar">
    <span class="brand-logo">PAGELLE BOOK COVERS</span>
  </header>

  <main class="login-main">
    <div class="login-card">
      <div class="login-card-header">
        <span class="modal-eyebrow">MEMBER ACCESS</span>
        <h1 class="login-title" id="loginHeading">Sign in to continue</h1>
        <p class="login-subtitle" id="loginSubheading">Enter your details to explore curated book covers and add your own.</p>
      </div>

      <div class="source-tabs login-tabs" role="tablist">
        <button type="button" class="source-tab active" data-auth-mode="signin">Sign In</button>
        <button type="button" class="source-tab" data-auth-mode="signup">Create Account</button>
      </div>

      <form class="login-form" id="authForm" novalidate>
        <div class="form-field hidden" id="nameFieldWrap">
          <label for="authName">Full Name</label>
          <input type="text" id="authName" placeholder="Your Name" maxlength="60" autocomplete="name" />
        </div>

        <div class="form-field">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-field">
          <label for="authPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="authPassword" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Show password">Show</button>
          </div>
        </div>

        <p class="form-error hidden" id="authError"></p>

        <button type="submit" class="primary-add-btn login-submit-btn" id="authSubmitBtn">Sign In</button>
      </form>

      <div class="login-demo-hint">
        <span>New visitor? Switch to <strong>Create Account</strong> above to register.</span>
      </div>
    </div>
  </main>

  <footer class="login-footer">
    <span>&copy; 2026 PAGELLE BOOK COVERS &middot; Contact: dhanushdevaraj10@gmail.com</span>
  </footer>

  <script type="module" src="login.js"></script>
</body>
</html>
